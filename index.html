<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Rescisão Trabalhista CLT</title>
    <meta name="description" content="Calculadora de rescisão exata. Ferramenta online para calcular rescisão online e cálculo de acerto trabalhista CLT de forma rápida e segura.">
    <meta name="keywords" content="calculadora de rescisão exata, calcular rescisão online, cálculo de acerto trabalhista CLT">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <header>
            <h1>Cálculo de Rescisão CLT</h1>
            <p>Descubra o valor exato do seu acerto trabalhista.</p>
        </header>

        <form id="rescisao-form">
            <div class="form-group">
                <label for="salario">Salário Bruto (R$)</label>
                <input type="number" id="salario" name="salario" step="0.01" min="0" required placeholder="Ex: 3500.00">
            </div>

            <div class="form-group">
                <label for="data-inicio">Data de Início</label>
                <input type="date" id="data-inicio" name="data-inicio" required>
            </div>

            <div class="form-group">
                <label for="data-demissao">Data de Demissão</label>
                <input type="date" id="data-demissao" name="data-demissao" required>
            </div>

            <div class="form-group">
                <label for="motivo">Motivo da Demissão</label>
                <select id="motivo" name="motivo" required>
                    <option value="sem_justa_causa">Demissão sem justa causa</option>
                    <option value="pedido_demissao">Pedido de demissão</option>
                    <option value="justa_causa">Demissão por justa causa</option>
                </select>
            </div>

            <div class="form-group">
                <label for="aviso-previo">Aviso Prévio</label>
                <select id="aviso-previo" name="aviso-previo" required>
                    <option value="trabalhado">Trabalhado</option>
                    <option value="indenizado">Indenizado</option>
                    <option value="nao_cumprido">Não cumprido (Descontado)</option>
                </select>
            </div>

            <button type="submit" class="btn-calcular">Calcular Rescisão</button>
        </form>

        <div id="results" class="results-container hidden">
            <!-- Results injected via JS -->
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
